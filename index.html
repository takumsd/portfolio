<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- Google tag (gtag.js) - Conditional Load -->
    <script>
        // 1. Opt-out Trigger: Check URL for ?optout=true
        if (window.location.search.includes('optout=true')) {
            localStorage.setItem('analytics_optout', 'true');
            // Visual Feedback (Banner)
            window.addEventListener('DOMContentLoaded', function () {
                var banner = document.createElement('div');
                banner.innerText = '【管理者設定】オプトアウト完了：計測から除外されました';
                banner.style.cssText = 'position:fixed; top:0; left:0; width:100%; background:red; color:white; padding:20px; z-index:9999; text-align:center; font-size:18px; font-weight:bold;';
                document.body.appendChild(banner);
            });
            alert('【管理者設定】オプトアウト完了しました。\nこのブラウザからのアクセスは今後計測されません。');
        }

        // 2. Load GA4 only if (NOT opted out) AND (NOT localhost)
        if (!localStorage.getItem('analytics_optout') &&
            location.hostname !== 'localhost' &&
            location.hostname !== '127.0.0.1') {

            var script = document.createElement('script');
            script.async = true;
            script.src = "https://www.googletagmanager.com/gtag/js?id=G-W0Z6EQW6TS";
            document.head.appendChild(script);

            window.dataLayer = window.dataLayer || [];
            function gtag() { dataLayer.push(arguments); }
            gtag('js', new Date());
            gtag('config', 'G-W0Z6EQW6TS');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takuji Masuda | Portfolio</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <meta name="robots" content="noindex, nofollow">

    <!-- Tailwind CSS (Play CDN for development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#ffffff',
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans JP"', '"Noto Sans"', 'sans-serif'],
                        serif: ['"Noto Sans JP"', '"Noto Sans"', 'sans-serif'],
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    },
                    animation: {
                        'float': 'float 15s ease-in-out infinite',
                        'float-delayed': 'float 18s ease-in-out infinite reverse',
                        'pulse-slow': 'pulse 10s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'prism': 'prism 8s linear infinite',
                        'fade-in': 'fadeIn 1.5s ease-out forwards',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=block"
        rel="stylesheet">


    <!-- React & Babel (CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Font Awesome (for icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom scrollbar for Webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #ffffff;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Hide Unicorn Studio Badge */
        a[href*="unicorn.studio"] {
            display: none !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        body {
            background-color: #ffffff;
            color: #1e293b;
            /* Slate-800 */
            font-family: 'Noto Sans JP', sans-serif;
            overflow-x: hidden;
        }

        /* Noise Texture */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opactiy='1'/%3E%3C/svg%3E");
            mix-blend-mode: multiply;
        }

        /* 16:9 スライドカード（PC表示時のみアスペクト比を固定）*/
        @media (min-width: 768px) {
            .project-card {
                aspect-ratio: 16 / 9;
            }
        }

        /* Smooth Scroll behavior */
        html {
            scroll-behavior: smooth;
        }

        /* Orbs Animation */
        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        /* Soft Linear Aurora / Prism Curtain Effect - High Visibility Fix */
        .aurora-linear-bg {
            position: fixed;
            inset: 0;
            z-index: -50;
            background: #eef2f6;
            /* Cool Gray-100 Base - Darker than white for white beams to show */
            overflow: hidden;
        }

        /* Moving Light Beams */
        .aurora-beam {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            pointer-events: none;
            filter: blur(60px);
            /* Removed blend mode to ensure visibility on light bg */
        }

        /* Beam 1: Sky Blue & White - Faster */
        .beam-1 {
            background: linear-gradient(115deg,
                    transparent 30%,
                    rgba(14, 165, 233, 0.3) 42%,
                    /* Sky Blue */
                    rgba(255, 255, 255, 0.9) 50%,
                    /* Strong White Line */
                    rgba(99, 102, 241, 0.3) 58%,
                    /* Indigo */
                    transparent 70%);
            transform: rotate(-15deg);
            animation: beam-flow 2s linear infinite alternate;
        }

        /* Beam 2: Silver & Faint Pink - Slower Reverse */
        .beam-2 {
            top: -60%;
            left: -40%;
            background: linear-gradient(125deg,
                    transparent 20%,
                    rgba(56, 189, 248, 0.3) 35%,
                    /* Cyan */
                    rgba(255, 255, 255, 0.8) 50%,
                    /* White */
                    rgba(168, 85, 247, 0.3) 65%,
                    /* Soft Purple */
                    transparent 80%);
            transform: rotate(-15deg);
            animation: beam-flow 3s linear infinite alternate-reverse;
            animation-delay: -1s;
        }

        /* Beam 3: Central Ambient Glow */
        .beam-3 {
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 60%);
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            filter: blur(80px);
            opacity: 0.5;
            animation: pulse-glow 6s ease-in-out infinite alternate;
        }


        @keyframes beam-flow {
            0% {
                transform: translate(-4%, -4%) rotate(-15deg);
            }

            100% {
                transform: translate(4%, 4%) rotate(-15deg);
            }
        }

        @keyframes pulse-glow {
            0% {
                opacity: 0.3;
                transform: scale(1);
            }

            100% {
                opacity: 0.6;
                transform: scale(1.05);
            }
        }

        .writing-vertical-rl {
            writing-mode: vertical-rl;
        }

        /* Responsive Fix for Short Screens: Disable Sticky to prevent clipping */
        @media (max-height: 850px) {
            #vision-values {
                height: auto !important;
            }

            #vision-values .sticky {
                position: relative !important;
                height: auto !important;
                overflow: visible !important;
                padding-bottom: 120px;
                /* Ensure bottom content is not cut off */
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <!-- Load Data -->
    <script src="src/data/content.js"></script>

    <!-- React Application -->
    <script type="text/babel">
        // --- Components ---

        // 1. Navigation (Mobile: Hamburger, PC: Vertical List)
        function Navigation() {
            const [open, setOpen] = React.useState(false);
            const [showLogo, setShowLogo] = React.useState(false);
            const menuItems = ['Home', 'Vision', 'Works', 'Profile'];

            React.useEffect(() => {
                const handleScroll = () => {
                    // Show logo after scrolling past the Hero section (approx window height)
                    if (window.scrollY > window.innerHeight - 100) {
                        setShowLogo(true);
                    } else {
                        setShowLogo(false);
                    }
                };

                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <>
                    {/* Header / Logo Area */}
                    <header className={`fixed top-0 left-0 right-0 z-[60] py-6 px-5 md:px-8 flex justify-between items-start pointer-events-none`}>
                        {/* Logo: Hidden in First View, appears on scroll */}
                        <a
                            href="#"
                            className={`pointer-events-auto font-serif text-sm md:text-base tracking-widest font-normal z-[60] text-gray-900 group transition-opacity duration-500 ${showLogo ? 'opacity-100' : 'opacity-0'}`}
                        >
                            TAKUJI <span className="font-bold">MASUDA</span> ｜ PORTFOLIO
                        </a>

                        {/* PC Navigation (Vertical List) */}
                        <nav className="hidden md:flex flex-col space-y-2 text-right z-[60] pointer-events-auto">
                            {menuItems.map((item) => (
                                <a
                                    key={item}
                                    href={`#${item.toLowerCase().replace(/ & /g, '-').replace(/ /g, '-')}`}
                                    className="font-serif text-sm font-normal tracking-widest text-gray-900 hover:text-cyan-600 transition-colors uppercase relative group"
                                >
                                    {item}
                                    <span className="absolute -right-2 top-1/2 w-1.5 h-1.5 bg-cyan-500 rounded-full opacity-0 transform scale-0 transition-all duration-300 group-hover:opacity-100 group-hover:scale-100 -translate-y-1/2"></span>
                                </a>
                            ))}
                        </nav>

                        {/* Mobile Hamburger Button */}
                        <button
                            onClick={() => setOpen(!open)}
                            className="md:hidden z-[60] p-2 hover:opacity-70 transition-opacity group pointer-events-auto"
                        >
                            <div className={`w-6 h-0.5 bg-gray-900 mb-1.5 transition-all duration-300 ${open ? 'rotate-45 translate-y-2 bg-white' : ''}`}></div>
                            <div className={`w-6 h-0.5 bg-gray-900 mb-1.5 transition-all duration-300 ${open ? 'opacity-0' : ''}`}></div>
                            <div className={`w-6 h-0.5 bg-gray-900 transition-all duration-300 ${open ? '-rotate-45 -translate-y-2 bg-white' : ''}`}></div>
                        </button>
                    </header>

                    {/* Mobile Full Screen Menu */}
                    <div className={`fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex flex-col justify-center items-center transition-all duration-700 md:hidden ${open ? 'opacity-100 visible' : 'opacity-0 invisible'}`}>
                        <nav className="flex flex-col space-y-8 text-center">
                            {menuItems.map((item, idx) => (
                                <a
                                    key={item}
                                    href={`#${item.toLowerCase().replace(/ & /g, '-').replace(/ /g, '-')}`}
                                    className={`text-3xl font-serif font-normal text-white/50 hover:text-white transition-all duration-500 transform uppercase ${open ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0'}`}
                                    style={{ transitionDelay: `${idx * 100}ms` }}
                                    onClick={() => setOpen(false)}
                                >
                                    {item}
                                </a>
                            ))}
                        </nav>
                        <div className="absolute bottom-12 text-gray-500 text-xs tracking-widest">
                            © 2024 TAKUJI MASUDA
                        </div>
                    </div>
                </>
            );
        }

        // 2. Hero Section (Title Only)
        function Hero() {
            return (
                <section id="home" className="relative min-h-screen flex flex-col justify-center items-center">
                    {/* Background Construction removed (Moved to Global) */}

                    <div className="relative z-10 text-center px-4">
                        <h1 className="font-sans font-bold tracking-[0.2em] text-gray-900 animate-fade-in opacity-0">
                            <span className="block text-xl md:text-2xl mb-2 whitespace-nowrap">
                                <span className="font-normal">TAKUJI</span> MASUDA
                            </span>
                            <span className="block text-sm md:text-base font-normal text-gray-500">PORTFOLIO</span>
                        </h1>
                    </div>

                    <div className="absolute bottom-10 left-12 hidden md:block animate-bounce">
                        <span className="text-xs text-gray-400 tracking-widest writing-vertical-rl">SCROLL DOWN</span>
                    </div>
                </section>
            );
        }

        // 3. About Me Section (Vision & Values) - Typography Refinement
        function AboutMe({ data }) {
            const visionPage = data.pages.find(p => p.pageNumber === 2);
            const valuesPage = data.pages.find(p => p.pageNumber === 3);

            // Vision parsing
            const visionText = visionPage ? visionPage.text : "";
            const visionLines = visionText.split('\n');
            const visionHeadline = visionLines[0];
            const visionBody = visionLines.slice(1).join('').replace(/。/g, '。\n');

            // Values parsing
            const values = valuesPage ? valuesPage.text.split('\n\n').map(section => {
                const lines = section.split('\n');
                return { title: lines[0], body: lines.slice(1).join('\n') };
            }) : [];

            // Animation Trigger Logic (Intersection Observer)
            const sectionRef = React.useRef(null);
            const [isVisible, setIsVisible] = React.useState(false);

            React.useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    // Trigger when the element crosses the line defined by rootMargin
                    if (entry.isIntersecting) {
                        setIsVisible(true);
                    }
                }, {
                    rootMargin: '0px 0px -50px 0px', // Trigger almost immediately (50px from bottom)
                    threshold: 0
                });

                if (sectionRef.current) {
                    observer.observe(sectionRef.current);
                }

                return () => observer.disconnect();
            }, []);

            // Sequential fade-in style helper
            const getStyle = (delay) => ({
                opacity: isVisible ? 1 : 0,
                transform: isVisible ? 'translateY(0)' : 'translateY(20px)',
                transition: `opacity 0.3s ease-out ${delay}s, transform 0.3s ease-out ${delay}s`
            });

            return (
                <section id="vision" className="relative" ref={sectionRef}>
                    <div className="flex items-start pt-24 pb-24 overflow-hidden bg-white/60 backdrop-blur-sm z-10">
                        <div className="max-w-6xl mx-auto px-6 md:px-12 w-full">
                            {/* Section Title */}
                            <h2 className="font-normal text-gray-900 mb-16 text-xl leading-relaxed tracking-widest" style={getStyle(0)}>
                                VISION
                            </h2>

                            {/* Vision Area */}
                            <div className="mb-24">
                                {/* Label */}
                                <p className="text-gray-500 mb-4 font-normal tracking-wide text-base leading-relaxed" style={getStyle(0.3)}>
                                    目指すところ
                                </p>
                                {/* Vision Headline */}
                                <h3 className="font-bold text-gray-900 mb-6 tracking-tight text-2xl md:text-4xl" style={{ ...getStyle(0.5), lineHeight: '1.3' }}>
                                    {visionHeadline}
                                </h3>
                                {/* Vision Body */}
                                <p className="text-gray-800 whitespace-pre-line text-justify font-normal text-base leading-[1.8]" style={getStyle(0.7)}>
                                    {visionBody}
                                </p>
                            </div>

                            {/* Values Area */}
                            <div style={getStyle(0.9)}>
                                {/* Label */}
                                <p className="text-gray-500 mb-4 font-normal tracking-wide text-base leading-relaxed">
                                    大切にしていること
                                </p>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-12">
                                    {values.map((val, idx) => (
                                        <div key={idx} className="group">
                                            {/* Values Title */}
                                            <h4 className="font-bold text-gray-900 mb-4 text-xl md:text-2xl" style={{ lineHeight: '1.4' }}>
                                                {val.title}
                                            </h4>
                                            {/* Values Body */}
                                            <p className="text-gray-600 whitespace-pre-line text-justify text-base leading-[1.8]">
                                                {val.body}
                                            </p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        // 4. スキル・制作実績 (16:9 Sticky Layout)
        function Projects({ data, onLastCardHeightChange, lastCardHeight }) {
            const workPages = data.pages.filter(p => p.pageNumber >= 5 && p.pageNumber <= 13);
            const lastCardRef = React.useRef(null);

            React.useLayoutEffect(() => {
                const target = lastCardRef.current;
                if (!target || !onLastCardHeightChange) return;
                const observer = new ResizeObserver(() => {
                    const cardContent = target.querySelector('.bg-white');
                    if (cardContent) {
                        onLastCardHeightChange(cardContent.offsetHeight);
                    }
                });
                observer.observe(target);
                return () => observer.disconnect();
            }, [onLastCardHeightChange]);

            // Window Resize Listener for Responsive Layout Logic
            const [windowWidth, setWindowWidth] = React.useState(typeof window !== 'undefined' ? window.innerWidth : 0);
            React.useEffect(() => {
                const handleResize = () => setWindowWidth(window.innerWidth);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // テキスト解析ヘルパー
            const parseProject = (text) => {
                const lines = text.split('\n');
                const category = lines[0];
                const periodIdx = lines.findIndex(l => l.startsWith('期間'));
                const roleIdx = lines.findIndex(l => l.startsWith('担当'));
                const bodyEnd = periodIdx !== -1 ? periodIdx : (roleIdx !== -1 ? roleIdx : lines.length);

                let titleLines = [];
                let bodyLines = [];
                let currentIdx = 1;
                while (currentIdx < bodyEnd) {
                    const line = lines[currentIdx];
                    const plainText = line.replace(/<[^>]*>/g, '');
                    if (plainText.length > 50 || titleLines.length >= 1) {
                        bodyLines = lines.slice(currentIdx, bodyEnd);
                        break;
                    }
                    titleLines.push(line);
                    currentIdx++;
                }
                if (bodyLines.length === 0 && currentIdx < bodyEnd) {
                    bodyLines = lines.slice(currentIdx, bodyEnd);
                }
                const title = titleLines.join('\n');
                const body = bodyLines.join('\n');
                const period = periodIdx !== -1 ? lines[periodIdx].replace('期間　', '').replace('期間 ', '').trim() : '';
                let role = '';
                if (roleIdx !== -1) {
                    // Extract role lines and strip leading whitespace/indentation from each line
                    role = lines.slice(roleIdx)
                        .map((line, i) => {
                            if (i === 0) return line.replace('担当　', '').replace('担当 ', '');
                            return line.replace(/^[\s　]+/, ''); // Strip leading spaces (full/half width)
                        })
                        .join('\n');
                }
                return { category, title, body, period, role };
            };

            // 16:9 プロジェクトカードコンポーネント
            const ProjectCard = ({ page, index }) => {
                const info = parseProject(page.text);
                const number = String(index + 1).padStart(2, '0');
                return (
                    <div className="max-w-6xl mx-auto w-full px-6 md:px-12">
                        <div className="project-card w-full bg-white rounded-2xl overflow-hidden flex flex-col md:flex-row border border-gray-200">
                            {/* テキストエリア（PC: 40%） */}
                            <div className="md:w-[40%] p-6 md:p-8 flex flex-col justify-between relative bg-white overflow-hidden">
                                <div>
                                    <div className="flex items-baseline gap-4 mb-4">
                                        <span className="font-serif text-gray-400 font-normal leading-none text-[40px]">{number}</span>
                                        <span className="text-gray-500 font-normal tracking-wider uppercase text-base translate-y-[-2px]">{info.category}</span>
                                    </div>
                                    <h3
                                        className="font-bold text-gray-900 mb-3 leading-snug text-xl"
                                        dangerouslySetInnerHTML={{ __html: info.title.replace(/\n/g, '<br/>') }}
                                    />
                                    <div
                                        className="text-gray-600 leading-normal text-justify text-sm"
                                        dangerouslySetInnerHTML={{ __html: info.body.replace(/\n/g, '<br/>') }}
                                    />
                                </div>
                                {(info.period || info.role) && (
                                    <div className="hidden md:block text-gray-500 space-y-1 font-mono pt-4 mt-4 text-xs">
                                        {info.period && (<div className="flex"><span className="w-12 shrink-0 opacity-70">期間</span><span>{info.period}</span></div>)}
                                        {info.role && (<div className="flex"><span className="w-12 shrink-0 opacity-70">担当</span><span className="whitespace-pre-line">{info.role}</span></div>)}
                                    </div>
                                )}
                            </div>
                            {/* 画像エリア（PC: 60%） */}
                            <div className="md:w-[60%] bg-gray-100 relative group flex items-center justify-center border-t md:border-t-0 md:border-l border-gray-100">
                                <img
                                    src={`images/Works_${number}.webp`}
                                    alt={`Project ${number} Image`}
                                    className="w-full h-auto block"
                                    onError={(e) => {
                                        e.target.style.display = 'none';
                                        e.target.nextSibling.style.display = 'flex';
                                    }}
                                />
                                <div className="absolute inset-0 flex items-center justify-center text-gray-300 font-serif italic text-lg" style={{ display: 'none' }}>
                                    Image not found
                                </div>
                            </div>
                            {/* モバイル用: 期間・担当（画像の下に表示） */}
                            {(info.period || info.role) && (
                                <div className="block md:hidden bg-white p-6 pt-4 text-gray-500 space-y-1 font-mono border-t border-gray-100 text-xs">
                                    {info.period && (<div className="flex"><span className="w-12 shrink-0 opacity-70">期間</span><span>{info.period}</span></div>)}
                                    {info.role && (<div className="flex"><span className="w-12 shrink-0 opacity-70">担当</span><span className="whitespace-pre-line">{info.role}</span></div>)}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // Scroll Trigger Animation
            const sectionRef = React.useRef(null);
            const [isVisible, setIsVisible] = React.useState(false);

            React.useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsVisible(true);
                    }
                }, {
                    rootMargin: '0px 0px -50% 0px', // Trigger when top reaches center of screen
                    threshold: 0
                });

                if (sectionRef.current) {
                    observer.observe(sectionRef.current);
                }
                return () => observer.disconnect();
            }, []);

            const fadeInStyle = {
                opacity: isVisible ? 1 : 0,
                transform: 'translateY(0)',
                transition: 'opacity 1s ease-out'
            };

            return (
                <section
                    id="works"
                    className="relative"
                    ref={sectionRef}
                    style={{ ...fadeInStyle }}
                >
                    {/* 1. タイトルレイヤー (Card 09 と同期してスクロールアウト) */}
                    <div className="relative md:sticky md:top-0 w-full z-50 pointer-events-none transition-all duration-300" style={{ height: (lastCardHeight > 0 && windowWidth >= 768) ? (150 + lastCardHeight) + 'px' : 'auto' }}>
                        <div className="max-w-6xl mx-auto px-6 md:px-12 w-full pt-24 md:pt-24 pb-8 md:pb-0">

                            </h2>

                    </div>

                    {/* 2. カードレイヤー */}
                    {/* 2. カードレイヤー */}
                    <div className="w-full relative pointer-events-auto mt-0 md:mt-[-150px]" style={{ paddingTop: '0px', marginTop: (lastCardHeight > 0 && windowWidth >= 768) ? `-${150 + lastCardHeight}px` : '0px', paddingTop: (windowWidth >= 768) ? '150px' : '0px' }}>

                            const isLast = idx === workPages.length - 1;
                            return (
                                <React.Fragment key={page.pageNumber}>
                                    <div
                                        className="relative md:sticky md:top-[150px] pointer-events-auto mb-12 md:mb-0"

                                        ref={isLast ? lastCardRef : null}

                                    </div>

                                </React.Fragment>
                            );

                    </div>
                </section>
            );
        }

        // 5. Profile Section (Refactored Layout)
        function Profile({ data, lastCardHeight }) {
            const contactPage = data.pages.find(p => p.pageNumber === 14);

            // Parsing Logic
            const parseProfile = (text) => {
                if (!text) return {};
                const lines = text.split('\n');

                // Assuming fixed structure based on content.js
                // Line 0: Kana Name, Line 1: Kanji Name, Line 2: Birthday...
                const nameJP = lines[1] || "";

                const getValue = (key) => {
                    const line = lines.find(l => l.includes(key));
                    return line ? line.replace(key, '').trim().replace(/^　+/, '') : "";
                };

                const birthday = getValue('生年月日');
                const birthplace = getValue('出身地');
                const hobby = getValue('趣味');

                // Career extraction (Multi-line)
                const careerIdx = lines.findIndex(l => l.includes('経歴'));
                const hobbyIdx = lines.findIndex(l => l.includes('趣味'));
                let career = [];
                if (careerIdx !== -1) {
                    const end = hobbyIdx !== -1 ? hobbyIdx : lines.length;
                    // First line includes the label '経歴', subsequent lines are indented
                    career.push(lines[careerIdx].replace('経歴', '').trim().replace(/^　+/, ''));
                    for (let i = careerIdx + 1; i < end; i++) {
                        career.push(lines[i].trim().replace(/^　+/, ''));
                    }
                }

                return { nameJP, birthday, birthplace, hobby, career };
            };

            const profile = parseProfile(contactPage ? contactPage.text : "");

            return (
                <section
                    id="profile"
                    className="relative z-30" // Removed bg-white
                >
                    <div className="relative w-full">
                        <div className="bg-white/60 backdrop-blur-sm relative pt-24 pb-[240px]"> {/* Changed bg-gray-50 to transparent style */}
                            <div className="max-w-5xl mx-auto px-6 relative z-10">
                                {/* Section Heading */}
                                <h2 className="font-normal text-gray-900 mb-16 text-xl leading-relaxed tracking-widest">
                                    PROFILE
                                </h2>

                                <div className="flex flex-col md:flex-row gap-12 md:gap-16 items-start">
                                    {/* Photo: Rectangular 3:4 */}
                                    <div className="w-2/3 md:w-[280px] shrink-0 mx-auto md:mx-0">
                                        <div className="aspect-[3/4] w-full bg-gray-200 relative overflow-hidden shadow-lg">
                                            <img
                                                src="images/portrait.jpg"
                                                alt="Portrait of Takuji Masuda"
                                                className="absolute inset-0 w-full h-full object-cover"
                                                onError={(e) => {
                                                    e.target.style.display = 'none';
                                                    e.target.nextSibling.style.display = 'flex';
                                                }}
                                            />
                                            {/* Fallback Placeholder */}
                                            <div className="absolute inset-0 bg-gradient-to-br from-gray-300 to-gray-400 flex items-center justify-center text-gray-500" style={{ display: 'none' }}>
                                                <i className="fas fa-user text-4xl opacity-50"></i>
                                            </div>
                                            {/* Stylistic overlay */}
                                            <div className="absolute inset-0 bg-blue-500/10 mix-blend-overlay"></div>
                                        </div>
                                    </div>

                                    {/* Text Info */}
                                    <div className="flex-1 pt-2">
                                        {/* Name Block */}
                                        <div className="mb-8">
                                            <p className="text-xs font-bold text-gray-400 tracking-widest mb-2 uppercase font-sans">
                                                TAKUJI MASUDA
                                            </p>
                                            <h3 className="font-bold text-gray-900 tracking-wide text-xl">
                                                {profile.nameJP || "枡田 卓史"}
                                            </h3>
                                        </div>

                                        {/* Info List - grid layout for alignment */}
                                        <dl className="grid grid-cols-[auto_1fr] gap-x-8 gap-y-4 text-sm">
                                            <dt className="text-gray-500 font-normal">生年月日</dt>
                                            <dd className="text-gray-900">{profile.birthday}</dd>

                                            <dt className="text-gray-500 font-normal">出身地</dt>
                                            <dd className="text-gray-900">{profile.birthplace}</dd>

                                            <dt className="text-gray-500 font-normal self-start">経歴</dt>
                                            <dd className="text-gray-900">
                                                {profile.career && profile.career.map((line, i) => (
                                                    <div key={i} className="mb-1">{line}</div>
                                                ))}
                                            </dd>

                                            <dt className="text-gray-500 font-normal">趣味</dt>
                                            <dd className="text-gray-900">{profile.hobby}</dd>
                                        </dl>
                                    </div>
                                </div>
                            </div>
                            <div className="absolute bottom-0 left-0 w-full flex justify-center pb-4 text-gray-400 text-sm tracking-wide font-sans">
                                &copy;2026 TAKUJI MASUDA
                            </div>
                        </div>
                    </div>
                </section>
            );
        }


    </script>
</body>
